# --- Bills: anything scheduled that money goes to -----------------------------

[[bill]]
key = "rent"
name = "rent"
type = "rent"
budget = "housing"
repeats = "FREQ=MONTHLY"

[[bill]]
key = "phone"
name = "phone"
type = "subscription"
budget = "phone"
repeats = "FREQ=MONTHLY"

[[bill]]
key = "streaming"
name = "streaming"
type = "subscription"
budget = "subscriptions"
repeats = "FREQ=MONTHLY"

[[bill]]
key = "software"
name = "software"
type = "subscription"
budget = "software"
repeats = "FREQ=MONTHLY"

[[bill]]
key = "car-loan"
name = "car loan"
type = "loan-payment"
budget = "car"
repeats = "FREQ=MONTHLY"

[[bill]]
key = "student-loan"
name = "student loan"
type = "loan-payment"
budget = "loans"
repeats = "FREQ=MONTHLY"

[[bill]]
key = "car-insurance"
name = "car insurance"
type = "insurance"
budget = "car"
repeats = "FREQ=MONTHLY;INTERVAL=6"

[[bill]]
key = "renters-insurance"
name = "renters insurance"
type = "insurance"
budget = "insurance"
