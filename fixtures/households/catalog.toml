# The catalog: what most households track, with no amounts.
# Households pick items by key; Metis offers them as suggestions at setup.
# Schedules are iCalendar repeat rules (RFC 5545).

# --- Account types -----------------------------------------------------------
# class: asset, liability, income or expense. on_budget: whether the account's
# money is routed through budgets.

[[account_type]]
key = "checking"
name = "checking"
class = "asset"
on_budget = true

[[account_type]]
key = "savings"
name = "savings"
class = "asset"
on_budget = true

[[account_type]]
key = "credit-card"
name = "credit card"
class = "liability"
on_budget = true

[[account_type]]
key = "loan"
name = "loan"
class = "liability"
on_budget = false

[[account_type]]
key = "brokerage"
name = "brokerage"
class = "asset"
on_budget = false

[[account_type]]
key = "employer"
name = "employer"
class = "income"
on_budget = false

[[account_type]]
key = "client"
name = "client"
class = "income"
on_budget = false

[[account_type]]
key = "merchant"
name = "merchant"
class = "expense"
on_budget = false

[[account_type]]
key = "service-provider"
name = "service provider"
class = "expense"
on_budget = false

[[account_type]]
key = "landlord"
name = "landlord"
class = "expense"
on_budget = false

[[account_type]]
key = "tax-agency"
name = "tax agency"
class = "expense"
on_budget = false

