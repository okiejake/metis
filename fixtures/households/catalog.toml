[[bill]]
key = "health-insurance"
name = "health insurance"
type = "insurance"
budget = "insurance"
repeats = "FREQ=MONTHLY"

[[bill]]
key = "estimated-taxes"
name = "estimated taxes"
type = "tax"
budget = "taxes"
repeats = "FREQ=MONTHLY;INTERVAL=3"

# --- Income ------------------------------------------------------------------

[[income]]
key = "pay-biweekly"
name = "pay biweekly"
type = "pay"
repeats = "FREQ=WEEKLY;INTERVAL=2"

[[income]]
key = "pay-semimonthly"
name = "pay semimonthly"
type = "pay"
repeats = "FREQ=MONTHLY;BYMONTHDAY=1,15"

[[income]]
key = "interest"
name = "interest"
type = "interest"
repeats = "FREQ=MONTHLY"
