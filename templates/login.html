{% extends "base.html" %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1 class="auth-brand">metis</h1>

    <form method="post" action="{{ base_path() }}/login" class="auth-form">
      <input type="hidden" name="next_path" value="{{ next_path }}" />
      <label>
        Name or email
        <input type="text" name="identifier" value="{{ identifier if identifier else '' }}"
               autocomplete="username" autofocus required />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="button-link auth-submit">Sign In</button>
    </form>
  </div>
</section>
{% endblock %}
