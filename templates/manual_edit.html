{% extends "base.html" %}
{% block content %}
<div class="page-bar">
  <div class="page-bar-title">
    <h2>edit transaction</h2>
  </div>
</div>

<section class="panel">
  <div class="panel-head">
    <h2>edit one-off transaction</h2>
  </div>
  <form method="post" action="{{ base_path() }}/manual/{{ tx.id }}/edit" class="grid-form compact">
    <input type="hidden" name="start" value="{{ start }}" />
    <input type="hidden" name="end" value="{{ end }}" />

    <label>
      name
      <input type="text" name="name" value="{{ tx.name }}" required />
    </label>

    <label>
      type
      <select name="kind" required>
        <option value="expense" {{ 'selected' if tx.kind == 'expense' else '' }}>expense</option>
        <option value="income" {{ 'selected' if tx.kind == 'income' else '' }}>income</option>
      </select>
    </label>

    <label>
      amount
      <input type="number" step="0.01" min="0.01" name="amount" value="{{ '%.2f'|format(tx.amount) }}" required />
    </label>

    <label>
      category
      <select name="category_id">
        <option value="">no category</option>
        {% for category in categories %}
        <option value="{{ category.id }}" {{ 'selected' if tx.category_id == category.id else '' }}>{% filter lower %}{{ category.name }}{% endfilter %}</option>
        {% endfor %}
      </select>
    </label>

    <label>
      date
      <input type="date" name="tx_date" value="{{ tx.tx_date }}" required />
    </label>

    <label class="checkbox-field full-row">
      <span class="checkbox-input-wrap">
        <input type="checkbox" name="make_recurring" value="1" />
        convert to recurring monthly and remove this one-off transaction
      </span>
    </label>

    <div class="full-row actions">
      <button type="submit" class="button-link">save changes</button>
      <a class="button-link" href="{{ base_path() }}/ledger?start={{ start }}&end={{ end }}">cancel</a>
    </div>
  </form>
</section>
{% endblock %}
