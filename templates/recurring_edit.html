{% extends "base.html" %}
{% block content %}
<div class="page-bar">
  <div class="page-bar-title">
    <h2>edit recurring item</h2>
  </div>
  <div class="intro-badge-stack">
    <span class="stat-chip">item {{ item.name }}</span>
    <span class="stat-chip">type {{ item.kind }}</span>
  </div>
</div>

<section class="panel">
  <div class="panel-head">
    <h2>edit recurring item</h2>
  </div>
  {% set item_day = item.day_of_month if item.day_of_month else item.start_date.day %}
  <form method="post" action="{{ base_path() }}/recurring/{{ item.id }}/edit" id="recurring-edit-form" class="grid-form">
    <label>
      name
      <input type="text" name="name" value="{{ item.name }}" required />
    </label>

    <label>
      type
      <select name="kind" required>
        <option value="income" {{ 'selected' if item.kind == 'income' else '' }}>income</option>
        <option value="expense" {{ 'selected' if item.kind == 'expense' else '' }}>expense</option>
      </select>
    </label>

    <label>
      amount
      <input type="number" step="0.01" min="0.01" name="amount" value="{{ '%.2f'|format(current_amount) }}" required />
    </label>

    <fieldset class="amount-scope full-row">
      <legend>when changing the amount:</legend>
      <label class="radio-label">
        <input type="radio" name="amount_change_scope" value="all" checked />
        apply to all occurrences
      </label>
      <label class="radio-label">
        <input type="radio" name="amount_change_scope" value="future" />
        apply from today forward only
      </label>
    </fieldset>

    <label>
      category
      <select name="category_id">
        <option value="">no category</option>
        {% for category in categories %}
        <option value="{{ category.id }}" {{ 'selected' if item.category_id == category.id else '' }}>{% filter lower %}{{ category.name }}{% endfilter %}</option>
        {% endfor %}
      </select>
    </label>

    <label>
      account
      <select name="account_id">
        <option value="">unassigned (immediate)</option>
        {% for account in accounts %}
        <option value="{{ account.id }}" {{ 'selected' if item.account_id == account.id else '' }}>{% filter lower %}{{ account.name }}{{ ' (card)' if account.account_type == 'credit_card' else '' }}{% endfilter %}</option>
        {% endfor %}
      </select>
    </label>

    <label>
      start date
      <input type="date" name="start_date" value="{{ item.start_date }}" required />
    </label>

    <label>
      end date (optional)
      <input type="date" name="end_date" value="{{ item.end_date if item.end_date else '' }}" />
    </label>

    <label>
      frequency
      <select name="frequency_type" id="frequency_type" required>
        <option value="weekly" {{ 'selected' if item.frequency_type == 'weekly' else '' }}>weekly</option>
        <option value="biweekly" {{ 'selected' if item.frequency_type == 'biweekly' else '' }}>bi-weekly</option>
        <option value="semimonthly" {{ 'selected' if item.frequency_type == 'semimonthly' else '' }}>semi-monthly</option>
        <option value="monthly" {{ 'selected' if item.frequency_type == 'monthly' else '' }}>monthly</option>
        <option value="yearly" {{ 'selected' if item.frequency_type == 'yearly' else '' }}>yearly</option>
        <option value="every_x_months" {{ 'selected' if item.frequency_type == 'every_x_months' else '' }}>every x months</option>
      </select>
    </label>
    <input type="hidden" name="day_of_month_touched" value="{{ 0 if item_day == item.start_date.day else 1 }}" id="day_of_month_touched" />

    <label data-field="interval_months" class="conditional hidden">
      every x months
      <input type="number" min="1" name="interval_months" value="{{ item.interval_months if item.interval_months else 1 }}" />
    </label>

    <label data-field="day_of_month" class="conditional hidden">
      day of month
      <input type="number" min="1" max="31" name="day_of_month" value="{{ item.day_of_month if item.day_of_month else item.start_date.day }}" />
    </label>

    <label data-field="semimonthly_day1" class="conditional hidden">
      semi-monthly day 1
      <input type="number" min="1" max="31" name="semimonthly_day1" value="{{ item.semimonthly_day1 if item.semimonthly_day1 else 1 }}" />
    </label>

    <label data-field="semimonthly_day2" class="conditional hidden">
      semi-monthly day 2
      <input type="number" min="1" max="31" name="semimonthly_day2" value="{{ item.semimonthly_day2 if item.semimonthly_day2 else 15 }}" />
    </label>

    <div class="full-row actions">
      <button type="submit" class="button-link">save changes</button>
      <a class="button-link" href="{{ base_path() }}/budget">cancel</a>
    </div>
  </form>
</section>

<script>
  const frequencySelect = document.getElementById('frequency_type');
  const startDateInput = document.querySelector('input[name="start_date"]');
  const dayOfMonthInput = document.querySelector('input[name="day_of_month"]');
  const dayTouchedInput = document.getElementById('day_of_month_touched');
  const intervalField = document.querySelector('[data-field="interval_months"]');
  const dayField = document.querySelector('[data-field="day_of_month"]');
  const semiDay1Field = document.querySelector('[data-field="semimonthly_day1"]');
  const semiDay2Field = document.querySelector('[data-field="semimonthly_day2"]');

  function syncDayOfMonthFromStart() {
    if (!startDateInput || !dayOfMonthInput || !dayTouchedInput || dayTouchedInput.value === '1') {
      return;
    }
    const value = startDateInput.value;
    if (!value) {
      return;
    }
    const day = Number.parseInt(value.split('-')[2], 10);
    if (!Number.isNaN(day) && day >= 1 && day <= 31) {
      dayOfMonthInput.value = String(day);
    }
  }

  function updateConditionalFields() {
    const value = frequencySelect.value;
    intervalField.classList.toggle('hidden', value !== 'every_x_months');
    dayField.classList.toggle('hidden', !(value === 'monthly' || value === 'every_x_months' || value === 'yearly'));
    semiDay1Field.classList.toggle('hidden', value !== 'semimonthly');
    semiDay2Field.classList.toggle('hidden', value !== 'semimonthly');
    syncDayOfMonthFromStart();
  }

  dayOfMonthInput.addEventListener('input', () => {
    dayTouchedInput.value = '1';
  });
  startDateInput.addEventListener('change', syncDayOfMonthFromStart);
  frequencySelect.addEventListener('change', updateConditionalFields);
  updateConditionalFields();
</script>
{% endblock %}
