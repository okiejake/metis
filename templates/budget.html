{% extends "base.html" %}
{% block content %}
<div class="page-bar">
  <div class="intro-badge-stack">
    {% if suggestion_count %}<a class="stat-chip success" href="{{ base_path() }}/inbox#bills">{{ suggestion_count }} suggested</a>{% endif %}
    <span class="stat-chip">{{ budget.bill_count }} {{ 'bill' if budget.bill_count == 1 else 'bills' }}</span>
    <span class="stat-chip">{{ budget.one_time_count }} one-time</span>
  </div>
</div>

{% include "_budget_section.html" %}
{% endblock %}
